<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 338" width="1500" height="338" font-family="Inter,Segoe UI,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b6478"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="20" font-weight="800" fill="#1a1523">Restaurant staff — a dine-in bill, start to close</text><text x="24" y="50" font-size="12" fill="#6b6478">Sign-in with PIN → POS → kitchen → payment → day close</text><g transform="translate(0 64)"><g><rect x="12" y="8" width="1476" height="108" rx="16" fill="#faf8fe" stroke="#e4def0"/><text x="26" y="30" font-size="11" font-weight="800" fill="#7d7391" stroke="#faf8fe" stroke-width="5" paint-order="stroke" letter-spacing="1.4" font-family="Inter,sans-serif">FRONT OF HOUSE</text></g><g><rect x="12" y="116" width="1476" height="108" rx="16" fill="#faf8fe" stroke="#e4def0"/><text x="26" y="138" font-size="11" font-weight="800" fill="#7d7391" stroke="#faf8fe" stroke-width="5" paint-order="stroke" letter-spacing="1.4" font-family="Inter,sans-serif">KITCHEN AND CLOSE</text></g><path d="M194 66 L229 66" fill="none" stroke="#6b6478" stroke-width="1.6" marker-end="url(#ah)"/><path d="M399 66 L434 66" fill="none" stroke="#6b6478" stroke-width="1.6" marker-end="url(#ah)"/><path d="M604 66 L639 66" fill="none" stroke="#6b6478" stroke-width="1.6" marker-end="url(#ah)"/><path d="M724 96 L724 150.4" fill="none" stroke="#6b6478" stroke-width="1.6" marker-end="url(#ah)"/><path d="M809 180.4 L844 180.4" fill="none" stroke="#6b6478" stroke-width="1.6" marker-end="url(#ah)"/><path d="M929 150.4 L929 96" fill="none" stroke="#6b6478" stroke-width="1.6" marker-end="url(#ah)"/><path d="M1014 66 L1049 66" fill="none" stroke="#6b6478" stroke-width="1.6" marker-end="url(#ah)"/><path d="M1134 96 L1134 180.4 L1254 180.4" fill="none" stroke="#6b6478" stroke-width="1.6" marker-end="url(#ah)"/><g data-id="pin"><rect x="24" y="36" width="170" height="60" rx="30" fill="#5b21b6" stroke="#3c096c" stroke-width="1.6"/><text x="109" y="62.375" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff" font-family="Inter,Segoe UI,sans-serif"><tspan x="109" dy="0">Sign in</tspan></text><text x="109" y="81.675" text-anchor="middle" font-size="10.5" font-weight="500" fill="#e9defc" font-family="Inter,Segoe UI,sans-serif"><tspan x="109" dy="0">username + PIN</tspan></text></g><g data-id="tab"><rect x="229" y="36" width="170" height="60" rx="12" fill="#ffffff" stroke="#b8aed0" stroke-width="1.6"/><text x="314" y="62.375" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1523" font-family="Inter,Segoe UI,sans-serif"><tspan x="314" dy="0">Pick a table</tspan></text><text x="314" y="81.675" text-anchor="middle" font-size="10.5" font-weight="500" fill="#6b6478" font-family="Inter,Segoe UI,sans-serif"><tspan x="314" dy="0">Tables</tspan></text></g><g data-id="add"><rect x="434" y="36" width="170" height="60" rx="12" fill="#ffffff" stroke="#b8aed0" stroke-width="1.6"/><text x="519" y="62.375" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1523" font-family="Inter,Segoe UI,sans-serif"><tspan x="519" dy="0">Add items</tspan></text><text x="519" y="75.1125" text-anchor="middle" font-size="10.5" font-weight="500" fill="#6b6478" font-family="Inter,Segoe UI,sans-serif"><tspan x="519" dy="0">search · categories ·</tspan><tspan x="519" dy="13.125">variants · kg panel</tspan></text></g><g data-id="send"><rect x="639" y="36" width="170" height="60" rx="12" fill="#ffffff" stroke="#b8aed0" stroke-width="1.6"/><text x="724" y="62.375" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1523" font-family="Inter,Segoe UI,sans-serif"><tspan x="724" dy="0">Send to kitchen</tspan></text><text x="724" y="81.675" text-anchor="middle" font-size="10.5" font-weight="500" fill="#6b6478" font-family="Inter,Segoe UI,sans-serif"><tspan x="724" dy="0">KOT prints</tspan></text></g><g data-id="kds"><rect x="639" y="150.4" width="170" height="60" rx="12" fill="#ffffff" stroke="#b8aed0" stroke-width="1.6"/><text x="724" y="176.775" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1523" font-family="Inter,Segoe UI,sans-serif"><tspan x="724" dy="0">Kitchen screen</tspan></text><text x="724" y="196.07500000000002" text-anchor="middle" font-size="10.5" font-weight="500" fill="#6b6478" font-family="Inter,Segoe UI,sans-serif"><tspan x="724" dy="0">cooking → ready</tspan></text></g><g data-id="serve"><rect x="844" y="150.4" width="170" height="60" rx="12" fill="#ffffff" stroke="#b8aed0" stroke-width="1.6"/><text x="929" y="184.775" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1523" font-family="Inter,Segoe UI,sans-serif"><tspan x="929" dy="0">Serve the table</tspan></text></g><g data-id="pay"><rect x="844" y="36" width="170" height="60" rx="12" fill="#ffffff" stroke="#b8aed0" stroke-width="1.6"/><text x="929" y="62.375" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1523" font-family="Inter,Segoe UI,sans-serif"><tspan x="929" dy="0">Payment</tspan></text><text x="929" y="75.1125" text-anchor="middle" font-size="10.5" font-weight="500" fill="#6b6478" font-family="Inter,Segoe UI,sans-serif"><tspan x="929" dy="0">cash · card · online ·</tspan><tspan x="929" dy="13.125">credit · custom</tspan></text></g><g data-id="rec"><rect x="1049" y="36" width="170" height="60" rx="12" fill="#ffffff" stroke="#b8aed0" stroke-width="1.6"/><text x="1134" y="62.375" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1523" font-family="Inter,Segoe UI,sans-serif"><tspan x="1134" dy="0">Receipt / invoice</tspan></text><text x="1134" y="81.675" text-anchor="middle" font-size="10.5" font-weight="500" fill="#6b6478" font-family="Inter,Segoe UI,sans-serif"><tspan x="1134" dy="0">58 / 80 mm or A4</tspan></text></g><g data-id="close"><rect x="1254" y="150.4" width="170" height="60" rx="30" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="1339" y="176.775" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d" font-family="Inter,Segoe UI,sans-serif"><tspan x="1339" dy="0">Close the shift</tspan></text><text x="1339" y="196.07500000000002" text-anchor="middle" font-size="10.5" font-weight="500" fill="#6b6478" font-family="Inter,Segoe UI,sans-serif"><tspan x="1339" dy="0">cash drawer · day close</tspan></text></g></g><g transform="translate(0 64)"><g><rect x="24" y="306" width="22" height="14" rx="4" fill="#5b21b6" stroke="#3c096c"/><text x="54" y="317" font-size="11" fill="#4b4458" font-family="Inter,sans-serif">Start</text></g><g><rect x="194" y="306" width="22" height="14" rx="4" fill="#ffffff" stroke="#b8aed0"/><text x="224" y="317" font-size="11" fill="#4b4458" font-family="Inter,sans-serif">Screen / step</text></g><g><rect x="364" y="306" width="22" height="14" rx="4" fill="#f3effc" stroke="#7c3aed"/><text x="394" y="317" font-size="11" fill="#4b4458" font-family="Inter,sans-serif">System / data</text></g><g><rect x="534" y="306" width="22" height="14" rx="4" fill="#fef3c7" stroke="#b45309"/><text x="564" y="317" font-size="11" fill="#4b4458" font-family="Inter,sans-serif">Decision</text></g><g><rect x="704" y="306" width="22" height="14" rx="4" fill="#dcfce7" stroke="#15803d"/><text x="734" y="317" font-size="11" fill="#4b4458" font-family="Inter,sans-serif">Done</text></g></g></svg>