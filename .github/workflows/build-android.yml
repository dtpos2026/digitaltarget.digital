# ============================================================================
# Build the white-label DT Customer APK on a runner that can reach Google.
#
# The Android Gradle Plugin, the Android platform and build-tools are served
# only from dl.google.com; Maven Central mirrors the plugin no further than
# 2.3.0 (2017). Any build environment without access to that host cannot
# assemble an APK at all — it fails while resolving the plugin, long before
# compiling anything. A GitHub-hosted runner has the Android SDK preinstalled
# and unrestricted access, so the real build happens here.
#
# ONE APK PER RESTAURANT
# The customer app is white-label: each restaurant gets its own package id,
# name and opening route. Those come from the workflow inputs; the tenant id
# is a starting route, not a security boundary — isolation is enforced by the
# database, where every public_customer_* function is scoped to the tenant it
# is handed. See supabase/migrations for the guards.
#
# NO PUSH NOTIFICATIONS
# Firebase was removed from this app in v1.30.0, on instruction. Nothing here
# can post a notification, so there is no google-services.json to supply and no
# GOOGLE_SERVICES_JSON secret to set. Order alerts happen in-app over Supabase
# while the app is open. See supabase/migrations for the outbox.
# ============================================================================
name: Build Android customer APK

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: 'Tenant UUID the APK opens into (blank = restaurant picker)'
        required: false
        default: ''
      app_id:
        description: 'Android package id, e.g. com.digitaltarget.dtcustomer'
        required: false
        default: 'com.digitaltarget.dtcustomer'
      app_name:
        description: 'App name shown under the launcher icon'
        required: false
        default: 'DT Customer'
      release:
        description: 'Build a signed release APK instead of debug'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # ===== v1.28.6 — an unset secret was blanking the backend =====
      #
      # These were passed straight into the build step's env. A secret that was
      # never set arrives as an EMPTY STRING, and an empty VITE_* variable
      # OVERRIDES the committed .env — so the bundle was compiled with no
      # Supabase configuration at all, and the APK could sign nobody in.
      #
      # The Windows installer shipped exactly that way and was reported from a
      # fresh install. Exporting only what is actually set lets the committed
      # .env stand.
      - name: Resolve the Supabase build configuration
        shell: bash
        env:
          S_URL: ${{ secrets.VITE_SUPABASE_URL }}
          S_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$S_URL" ]; then
            echo "VITE_SUPABASE_URL=$S_URL" >> "$GITHUB_ENV"
            echo "using VITE_SUPABASE_URL from repository secrets"
          else
            echo "no VITE_SUPABASE_URL secret — the committed .env will be used"
          fi
          if [ -n "$S_KEY" ]; then
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$S_KEY" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_ANON_KEY=$S_KEY" >> "$GITHUB_ENV"
          fi

      # The keys compiled into the bundle are the PUBLISHABLE ones — the same
      # ones the website already serves to every browser. The service-role key
      # must never exist in CI.
      - name: Build the web bundle for this restaurant
        env:
          DT_APP_TENANT: ${{ github.event.inputs.tenant_id }}
        run: npm run build:app

      # Proving it, rather than trusting the step above.
      - name: Verify the bundle carries a backend
        shell: bash
        run: |
          if grep -rqE 'https://[a-z0-9]+\.supabase\.co' dist/client/assets/*.js; then
            echo "the bundle carries a Supabase URL"
          else
            echo "::error::The bundle was built with NO Supabase configuration. The APK would open and refuse every login. Check the VITE_SUPABASE_* secrets, or remove them so the committed .env is used."
            exit 1
          fi

      - name: Brand the Capacitor config
        env:
          APP_ID: ${{ github.event.inputs.app_id }}
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: node scripts/brand-app.mjs

      # Regenerates capacitor-cordova-android-plugins/, which Capacitor's own
      # .gitignore excludes but settings.gradle includes unconditionally — the
      # "cordova.variables.gradle does not exist" failure — and verifies every
      # file Gradle is about to read before Gradle is ever started.
      - name: Restore and verify the Android project
        run: npm run android:doctor

      - name: Assemble debug APK
        if: ${{ github.event.inputs.release != 'true' }}
        working-directory: android/Customer
        run: ./gradlew --no-daemon assembleDebug

      - name: Decode the release keystore
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::A release build needs ANDROID_KEYSTORE_BASE64. Unsigned release APKs cannot be installed."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/Customer/app/release.keystore

      - name: Assemble release APK
        if: ${{ github.event.inputs.release == 'true' }}
        working-directory: android/Customer
        env:
          DT_KEYSTORE_PATH: release.keystore
          DT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the APK exists
        run: |
          set -e
          APK=$(find android/Customer/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          ls -l "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dt-customer-apk
          path: android/Customer/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
