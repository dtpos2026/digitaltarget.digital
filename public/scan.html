<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Digital Receipt</title>
<!--
  DT POS — what a receipt QR opens on a phone.
  The bill (#r=…) or the shop's links (#l=…) travel inside the link itself,
  after the #, which a browser never sends to any server: this page only
  reads and shows them. No sign-in, no tracking, nothing stored.
  Published with the Super Admin panel (superadmin/public → dist).
-->
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --brand:#0f766e; --ok:#047857; --okbg:#d1fae5; --warn:#b45309; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1120; --card:#111827; --ink:#f3f4f6; --muted:#9ca3af; --line:#1f2937; --brand:#2dd4bf; --ok:#6ee7b7; --okbg:#064e3b; --warn:#fcd34d; --warnbg:#451a03; --bad:#fca5a5; --badbg:#450a0a; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 16px 16px 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .shop { text-align: center; margin-bottom: 14px; }
  .shop h1 { margin: 0; font-size: 20px; letter-spacing: .2px; }
  .shop p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .total { text-align: center; padding: 14px 0 10px; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); }
  .total .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .total .amount { font-size: 32px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
  .pill.ok { color: var(--ok); background: var(--okbg); } .pill.warn { color: var(--warn); background: var(--warnbg); } .pill.bad { color: var(--bad); background: var(--badbg); }
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; padding: 12px 0; font-size: 13px; }
  .meta div span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .meta div b { font-weight: 650; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; font-weight: 600; padding: 6px 0; border-bottom: 1px solid var(--line); }
  td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 10px; }
  td .q { color: var(--muted); font-size: 12px; }
  .more { color: var(--muted); font-size: 12px; padding-top: 8px; }
  .sums { padding-top: 10px; font-size: 14px; }
  .sums div { display: flex; justify-content: space-between; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .sums .grand { font-weight: 800; font-size: 16px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }
  .links { display: grid; gap: 10px; margin-top: 4px; }
  a.link { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; font-weight: 650; font-size: 16px; min-height: 56px; }
  a.link:active { transform: scale(.99); }
  a.link .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: 0 0 auto; }
  a.link .ic svg { width: 18px; height: 18px; fill: currentColor; }
  a.link .go { margin-left: auto; color: var(--muted); font-size: 20px; }
  .err { text-align: center; padding: 28px 10px; }
  .err h1 { font-size: 18px; margin: 0 0 6px; }
  .err p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="card err"><h1>Opening…</h1></div></main>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === 'text') n.textContent = attrs[k]; else if (k === 'cls') n.className = attrs[k]; else n.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function decode(b64) {
    var s = b64.replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(s + '==='.slice((s.length + 3) % 4));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function money(cur, v) {
    var n = Number(v) || 0;
    return (cur ? cur + ' ' : '') + n.toLocaleString('en-PK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function safeUrl(u) {
    try { var x = new URL(String(u)); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : null; } catch (e) { return null; }
  }
  function fail(title, text) {
    app.replaceChildren(el('div', { cls: 'card err' }, [el('h1', { text: title }), el('p', { text: text })]));
  }

  var STATUS = { paid: ['Paid', 'ok'], credit: ['On credit', 'warn'], partial: ['Part paid', 'warn'], unpaid: ['Unpaid', 'warn'], void: ['Void', 'bad'], cancelled: ['Cancelled', 'bad'], complimentary: ['Complimentary', 'ok'] };

  function receipt(d) {
    document.title = (d.s ? d.s + ' — ' : '') + 'Bill #' + d.n;
    var cur = d.c || 'Rs';
    var st = STATUS[d.p] || [String(d.p || ''), 'warn'];
    var rows = (d.i || []).map(function (it) {
      return el('tr', null, [
        el('td', null, [String(it[0] || ''), el('div', { cls: 'q', text: '× ' + it[1] })]),
        el('td', { cls: 'n', text: money('', it[2]) }),
      ]);
    });
    var sums = [['Subtotal', d.S], ['Discount', d.D, '- '], ['Tax', d.X], ['Service charge', d.V], ['Delivery', d.L]]
      .filter(function (r) { return r[1]; })
      .map(function (r) { return el('div', null, [el('span', { text: r[0] }), el('span', { text: (r[2] || '') + money(cur, r[1]) })]); });
    sums.push(el('div', { cls: 'grand' }, [el('span', { text: 'Total' }), el('span', { text: money(cur, d.T) })]));
    var meta = [['Bill', '#' + d.n], ['Date', d.t], ['Order', d.o], ['Payment', d.m ? String(d.m).toUpperCase() : '']]
      .filter(function (m) { return m[1]; })
      .map(function (m) { return el('div', null, [el('span', { text: m[0] }), el('b', { text: m[1] })]); });
    app.replaceChildren(
      el('div', { cls: 'card' }, [
        el('div', { cls: 'shop' }, [el('h1', { text: d.s || 'Receipt' }), d.b ? el('p', { text: d.b }) : null, d.h ? el('p', { text: d.h }) : null]),
        el('div', { cls: 'total' }, [el('div', { cls: 'label', text: 'Total' }), el('div', { cls: 'amount', text: money(cur, d.T) }), el('span', { cls: 'pill ' + st[1], text: st[0] })]),
        el('div', { cls: 'meta' }, meta),
        el('table', null, [el('thead', null, [el('tr', null, [el('th', { text: 'Item' }), el('th', { cls: 'n', text: 'Amount' })])]), el('tbody', null, rows)]),
        d['+'] ? el('div', { cls: 'more', text: '+ ' + d['+'] + ' more item(s) — see your printed receipt.' }) : null,
        el('div', { cls: 'sums' }, sums),
      ]),
      el('p', { cls: 'foot', text: (d.r ? 'Ref ' + d.r + ' · ' : '') + 'Digital receipt · DT POS' }),
    );
  }

  var ICONS = {
    google: ['#4285F4', 'M12 11v3.2h4.5c-.2 1.2-1.4 3.5-4.5 3.5-2.7 0-4.9-2.2-4.9-5s2.2-5 4.9-5c1.5 0 2.6.7 3.2 1.2l2.2-2.1C16 5.5 14.2 4.7 12 4.7 7.9 4.7 4.7 8 4.7 12s3.2 7.3 7.3 7.3c4.2 0 7-3 7-7.1 0-.5 0-.8-.1-1.2H12z'],
    facebook: ['#1877F2', 'M13.5 21v-7.7h2.6l.4-3H13.5V8.4c0-.9.3-1.5 1.5-1.5h1.6V4.2c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21h3.1z'],
    instagram: ['#E1306C', 'M12 7.3A4.7 4.7 0 1 0 12 16.7 4.7 4.7 0 0 0 12 7.3zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm6-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM12 4c2.2 0 2.4 0 3.3.1 2.2.1 3.2 1.1 3.3 3.3.1.9.1 1.1.1 3.3v2.6c0 2.2 0 2.4-.1 3.3-.1 2.2-1.1 3.2-3.3 3.3-.9.1-1.1.1-3.3.1s-2.4 0-3.3-.1c-2.2-.1-3.2-1.1-3.3-3.3C5.3 15.7 5.3 15.5 5.3 13.3v-2.6c0-2.2 0-2.4.1-3.3.1-2.2 1.1-3.2 3.3-3.3C9.6 4 9.8 4 12 4z'],
    whatsapp: ['#25D366', 'M12 3.5a8.4 8.4 0 0 0-7.2 12.8L3.6 20.5l4.3-1.1A8.4 8.4 0 1 0 12 3.5zm4.9 11.9c-.2.6-1.2 1.1-1.7 1.2-.4.1-1 .1-1.6-.1-3-1.1-4.9-3.9-5.1-4.1-.1-.2-1.2-1.6-1.2-3s.8-2.2 1-2.5c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.3.3c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1.9 2 1.2 2.3 1.3.3.2.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.4.2.5.3.1.2.1.7-.2 1.4z'],
    website: ['#0F766E', 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zm5.8 5.2h-2.4a13 13 0 0 0-1.1-3.1 6.8 6.8 0 0 1 3.5 3.1zM12 5.3c.7.9 1.3 2.1 1.6 3.4h-3.2c.3-1.3.9-2.5 1.6-3.4zM5.4 13.5a6.9 6.9 0 0 1 0-3h2.7a14 14 0 0 0 0 3H5.4zm.8 1.8h2.4c.3 1.1.6 2.2 1.1 3.1a6.8 6.8 0 0 1-3.5-3.1zM8.6 8.7H6.2a6.8 6.8 0 0 1 3.5-3.1c-.5.9-.8 2-1.1 3.1zM12 18.7c-.7-.9-1.3-2.1-1.6-3.4h3.2c-.3 1.3-.9 2.5-1.6 3.4zm1.9-5.2h-3.8a12 12 0 0 1 0-3h3.8a12 12 0 0 1 0 3zm.4 4.9c.5-.9.8-2 1.1-3.1h2.4a6.8 6.8 0 0 1-3.5 3.1zm1.6-4.9a14 14 0 0 0 0-3h2.7a6.9 6.9 0 0 1 0 3h-2.7z'],
    youtube: ['#FF0000', 'M20.6 8.2c-.2-.9-.9-1.6-1.8-1.8C17.2 6 12 6 12 6s-5.2 0-6.8.4c-.9.2-1.6.9-1.8 1.8C3 9.8 3 12 3 12s0 2.2.4 3.8c.2.9.9 1.6 1.8 1.8 1.6.4 6.8.4 6.8.4s5.2 0 6.8-.4c.9-.2 1.6-.9 1.8-1.8.4-1.6.4-3.8.4-3.8s0-2.2-.4-3.8zM10.2 14.7V9.3l4.6 2.7-4.6 2.7z'],
    tiktok: ['#111111', 'M16.6 6.8a4.3 4.3 0 0 1-2.5-2.3h-2.6v10.6a2.3 2.3 0 1 1-1.6-2.2V10.2a4.9 4.9 0 1 0 4.2 4.9V9.7a6.9 6.9 0 0 0 3.9 1.2V8.3c-.5 0-1-.1-1.4-.3z'],
    custom: ['#6B7280', 'M10.6 13.4a1 1 0 0 0 1.4 0l3.5-3.5a3 3 0 0 0-4.2-4.2l-1.2 1.2a1 1 0 1 0 1.4 1.4l1.2-1.2a1 1 0 0 1 1.4 1.4L10.6 12a1 1 0 0 0 0 1.4zm2.8-2.8a1 1 0 0 0-1.4 0l-3.5 3.5a3 3 0 0 0 4.2 4.2l1.2-1.2a1 1 0 1 0-1.4-1.4l-1.2 1.2a1 1 0 0 1-1.4-1.4l3.5-3.5a1 1 0 0 0 0-1.4z'],
  };
  var NAMES = { google: 'Review us on Google', facebook: 'Facebook', instagram: 'Instagram', whatsapp: 'WhatsApp', website: 'Website', youtube: 'YouTube', tiktok: 'TikTok', custom: 'Open link' };

  function links(d) {
    document.title = d.s || 'Links';
    var items = (d.k || []).map(function (k) {
      var url = safeUrl(k[1]);
      if (!url) return null;
      var ic = ICONS[k[0]] || ICONS.custom;
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', ic[1]);
      svg.appendChild(path);
      var badge = el('span', { cls: 'ic' }, [svg]);
      badge.style.background = ic[0];
      return el('a', { cls: 'link', href: url, rel: 'noopener noreferrer' }, [badge, el('span', { text: k[2] || NAMES[k[0]] || 'Open link' }), el('span', { cls: 'go', text: '›' })]);
    }).filter(Boolean);
    if (!items.length) return fail('No links', 'This code has no links to open.');
    app.replaceChildren(
      el('div', { cls: 'shop' }, [el('h1', { text: d.s || 'Welcome' }), el('p', { text: 'Tap to open' })]),
      el('div', { cls: 'links' }, items),
      el('p', { cls: 'foot', text: 'DT POS' }),
    );
  }

  try {
    var m = /^#([rl])=([A-Za-z0-9_-]+)$/.exec(location.hash || '');
    if (!m) return fail('Nothing to show', 'Scan the QR code on your receipt to open it here.');
    var data = decode(m[2]);
    if (!data || data.v !== 1) return fail('Unreadable code', 'This QR code is from a newer version. Please ask the restaurant.');
    if (m[1] === 'r') receipt(data); else links(data);
  } catch (e) {
    fail('Unreadable code', 'This QR code could not be read. Please scan it again.');
  }
})();
</script>
</body>
</html>
